[workspace]
resolver = "2"
members = [
    "railbench-core",
    "railbench-app",
]

[workspace.package]
version = "26.11.1"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytemuck = { version = "1", features = ["derive"] }
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
rfd = "0.15"
tungstenite = "0.26"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
