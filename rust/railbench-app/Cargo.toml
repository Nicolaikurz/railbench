[package]
name = "railbench-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Rust desktop application for RAILbench (egui + wgpu)"

[dependencies]
railbench-core = { path = "../railbench-core" }
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
bytemuck = { version = "1", features = ["derive"] }
rfd = "0.15"
serde_json = "1.0"
tungstenite = "0.26"
