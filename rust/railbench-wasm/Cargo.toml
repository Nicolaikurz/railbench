[package]
name = "railbench-wasm"
version = "0.1.0"
edition = "2021"
description = "High-performance WebAssembly math kernels (power simulation & 3D terrain) for RAILbench"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
