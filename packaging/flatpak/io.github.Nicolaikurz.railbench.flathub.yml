app-id: io.github.Nicolaikurz.railbench
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: railbench
separate-locales: false

finish-args:
  # Wayland & X11 display server protocols
  - --socket=wayland
  - --socket=x11
  # Hardware-accelerated Vulkan / OpenGL rendering
  - --device=dri
  # Inter-process communication
  - --share=ipc
  # Network access for real-time WebSocket multi-user collaboration
  - --share=network
  # File access to download and documents folders for saving and loading tracks
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  # Desktop notifications support
  - --talk-name=org.freedesktop.Notifications

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin

modules:
  - name: railbench
    buildsystem: simple
    build-commands:
      - cargo build --offline --release --manifest-path rust/Cargo.toml -p railbench-app
      - install -Dm755 rust/target/release/railbench-app /app/bin/railbench
      - install -Dm644 packaging/flatpak/io.github.Nicolaikurz.railbench.desktop /app/share/applications/io.github.Nicolaikurz.railbench.desktop
      - install -Dm644 packaging/flatpak/io.github.Nicolaikurz.railbench.metainfo.xml /app/share/metainfo/io.github.Nicolaikurz.railbench.metainfo.xml
      - install -Dm644 packaging/flatpak/icon.png /app/share/icons/hicolor/512x512/apps/io.github.Nicolaikurz.railbench.png
    sources:
      - type: dir
        path: ../..
