app-id: de.railbench.Railbench
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: railbench
separate-locales: false

finish-args:
  # Wayland & X11 display server protocols
  - --socket=wayland
  - --socket=x11
  # Hardware-accelerated OpenGL / WebGL rendering
  - --device=dri
  # Inter-process communication
  - --share=ipc
  # Network access for real-time WebSocket multi-user collaboration
  - --share=network
  # File access to download and documents folders for saving and loading tracks
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  # Desktop notifications support
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: railbench
    buildsystem: simple
    build-commands:
      - mkdir -p /app/main
      - cp -r * /app/main/
      - chmod +x /app/main/railbench || true
      - mkdir -p /app/bin
      - install -Dm755 railbench.sh /app/bin/railbench
      - install -Dm644 de.railbench.Railbench.desktop /app/share/applications/de.railbench.Railbench.desktop
      - install -Dm644 de.railbench.Railbench.metainfo.xml /app/share/metainfo/de.railbench.Railbench.metainfo.xml
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/de.railbench.Railbench.png
    sources:
      - type: archive
        url: https://github.com/Nicolaikurz/railbench/releases/download/v0.6.0/railbench-0.6.0-linux-x64.tar.gz
        sha256: __REPLACE_WITH_SHA256_LINUX_X64__
        only-arches:
          - x86_64
      - type: archive
        url: https://github.com/Nicolaikurz/railbench/releases/download/v0.6.0/railbench-0.6.0-linux-arm64.tar.gz
        sha256: __REPLACE_WITH_SHA256_LINUX_ARM64__
        only-arches:
          - aarch64
      - type: file
        path: railbench.sh
      - type: file
        path: de.railbench.Railbench.desktop
      - type: file
        path: de.railbench.Railbench.metainfo.xml
      - type: file
        path: icon.png
