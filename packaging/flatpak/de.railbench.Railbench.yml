app-id: de.railbench.Railbench
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: railbench
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: railbench
    buildsystem: simple
    build-commands:
      - mkdir -p /app/main
      - cp -r * /app/main/
      - chmod +x /app/main/railbench || chmod +x /app/main/Gleisplan
      - mkdir -p /app/bin
      - install -Dm755 railbench.sh /app/bin/railbench
      - install -Dm644 de.railbench.Railbench.desktop /app/share/applications/de.railbench.Railbench.desktop
      - install -Dm644 de.railbench.Railbench.metainfo.xml /app/share/metainfo/de.railbench.Railbench.metainfo.xml
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/de.railbench.Railbench.png
    sources:
      - type: dir
        path: ../../release/linux-unpacked
      - type: file
        path: railbench.sh
      - type: file
        path: de.railbench.Railbench.desktop
      - type: file
        path: de.railbench.Railbench.metainfo.xml
      - type: file
        path: ../../build/icon.png

