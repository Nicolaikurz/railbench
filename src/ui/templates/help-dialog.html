<div class="rb-modal-card help-modal-card">
  <div class="rb-modal-header">
    <div class="rb-modal-title">
      <span>{{MODAL_TITLE}}</span>
      <span class="brand-badge">{{VERSION_TAG}}</span>
    </div>
    <button class="rb-modal-close-btn" id="help-modal-close" title="{{CLOSE_TITLE}}">✕</button>
  </div>

  <div class="help-modal-layout">
    <!-- Linke Navigationsleiste -->
    <div class="help-nav-sidebar">
      {{NAV_BUTTONS}}
    </div>

    <!-- Rechter Inhaltsbereich -->
    <div class="help-content-area" id="help-content-area"></div>
  </div>

  <div class="rb-modal-footer">
    <span class="help-footer-tip">{{FOOTER_TIP}}</span>
    <button class="rb-btn rb-btn-primary" id="help-btn-close">{{CLOSE_BTN_TEXT}}</button>
  </div>
</div>
