<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Railbench – Model Railway Track Planner</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("railbench_theme_pref") || localStorage.getItem("theme-pref");
          var isDark = false;
          if (saved === "dark") {
            isDark = true;
          } else if (saved === "light") {
            isDark = false;
          } else {
            isDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          }
          document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
          document.documentElement.setAttribute("data-theme-pref", saved || "system");
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="app">
      <div id="toolbar"></div>
      <div id="sidebar"></div>
      <div id="canvas-host"></div>
      <div id="right-sidebar"></div>
    </div>
    <div id="print-mount-point"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
