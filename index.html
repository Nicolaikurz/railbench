<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Railbench – Model Railway Track Planner</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("railbench_theme_pref") || localStorage.getItem("theme-pref");
          var isDark = false;
          if (saved === "dark") {
            isDark = true;
          } else if (saved === "light") {
            isDark = false;
          } else {
            isDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          }
          document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
          document.documentElement.setAttribute("data-theme-pref", saved || "system");
        } catch (e) {}
      })();
    </script>
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      :root, [data-theme="light"] {
        color-scheme: light;
        --bg-app: #f8fafc;
        --bg-toolbar: #1e293b;
        --toolbar-text: #f8fafc;
        --bg-sidebar: #f8fafc;
        --bg-card: #ffffff;
        --bg-card-hover: #f1f5f9;
        --bg-surface: #f1f5f9;
        --bg-input: #ffffff;
        --text-main: #0f172a;
        --text-sub: #334155;
        --text-muted: #64748b;
        --border-main: #e2e8f0;
        --border-subtle: #f1f5f9;
        --primary-color: #0284c7;
        --primary-hover: #0369a1;
        --canvas-bg: #e4dfd5;
      }

      [data-theme="dark"] {
        color-scheme: dark;
        --bg-app: #090d16;
        --bg-toolbar: #040711;
        --toolbar-text: #f8fafc;
        --bg-sidebar: #0f172a;
        --bg-card: #1e293b;
        --bg-card-hover: #26354a;
        --bg-surface: #151f32;
        --bg-input: #151f32;
        --text-main: #f8fafc;
        --text-sub: #cbd5e1;
        --text-muted: #94a3b8;
        --border-main: #24344d;
        --border-subtle: #151f32;
        --primary-color: #38bdf8;
        --primary-hover: #0284c7;
        --canvas-bg: #111726;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --bg-app: #090d16;
          --bg-toolbar: #040711;
          --toolbar-text: #f8fafc;
          --bg-sidebar: #0f172a;
          --bg-card: #1e293b;
          --bg-card-hover: #26354a;
          --bg-surface: #151f32;
          --bg-input: #151f32;
          --text-main: #f8fafc;
          --text-sub: #cbd5e1;
          --text-muted: #94a3b8;
          --border-main: #24344d;
          --border-subtle: #151f32;
          --primary-color: #38bdf8;
          --primary-hover: #0284c7;
          --canvas-bg: #111726;
        }
      }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: var(--text-main);
        background: var(--bg-app);
        overflow: hidden;
        user-select: none;
      }

      #app {
        display: grid;
        grid-template-columns: var(--sidebar-width, 280px) 1fr;
        grid-template-rows: var(--toolbar-height, 42px) 1fr;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        position: relative;
      }

      /* --- TOOLBAR --- */
      :root, #app {
        --toolbar-height: 42px;
        --tb-btn-height: clamp(24px, calc(var(--toolbar-height, 42px) - 12px), 52px);
        --tb-icon-size: clamp(13px, calc(var(--tb-btn-height, 28px) * 0.52), 22px);
        --tb-btn-font-size: clamp(10.5px, calc(var(--tb-btn-height, 28px) * 0.41), 15px);
        --tb-btn-padding-x: clamp(5px, calc(var(--tb-btn-height, 28px) * 0.26), 12px);
      }

      #toolbar {
        grid-column: 1 / 3;
        background: var(--bg-toolbar);
        color: var(--toolbar-text);
        border-bottom: 1px solid #334155;
        display: flex;
        align-items: center;
        padding: 0 10px;
        z-index: 100;
        overflow: visible;
        position: relative;
        height: var(--toolbar-height, 42px);
        box-sizing: border-box;
      }

      #toolbar::-webkit-scrollbar {
        height: 3px;
      }

      #toolbar::-webkit-scrollbar-track {
        background: transparent;
      }

      #toolbar::-webkit-scrollbar-thumb {
        background: #475569;
        border-radius: 3px;
      }

      .toolbar-container {
        display: flex;
        align-items: center;
        width: 100%;
        min-width: max-content;
        gap: 5px;
      }

      .toolbar-brand {
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: -0.01em;
        margin-right: 4px;
        flex-shrink: 0;
      }

      .brand-icon { font-size: 16px; line-height: 1; }
      .brand-title { color: #f8fafc; font-weight: 700; }
      .brand-file {
        font-size: 11px;
        color: #94a3b8;
        max-width: 140px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        user-select: none;
        transition: color 0.15s;
      }
      .brand-file.dirty {
        color: #f59e0b;
        font-weight: 600;
        cursor: pointer;
      }
      .brand-file.dirty:hover {
        color: #fbbf24;
        text-decoration: underline;
      }
      #tb-save.has-unsaved {
        position: relative;
        color: #f59e0b;
      }
      #tb-save.has-unsaved::after {
        content: "";
        position: absolute;
        top: 4px;
        right: 4px;
        width: 6px;
        height: 6px;
        background: #f59e0b;
        border-radius: 50%;
        box-shadow: 0 0 4px #f59e0b;
      }

      .brand-badge {
        font-size: 10.5px;
        background: #334155;
        color: #94a3b8;
        padding: 2px 6px;
        border-radius: 999px;
        font-weight: 500;
        white-space: nowrap;
      }

      .toolbar-divider {
        width: 1px;
        height: calc(var(--tb-btn-height, 28px) * 0.7);
        background: #334155;
        margin: 0 3px;
        flex-shrink: 0;
      }

      .toolbar-group {
        display: flex;
        align-items: center;
        gap: clamp(2px, calc(var(--tb-btn-height, 28px) * 0.12), 5px);
        flex-shrink: 0;
      }

      .toolbar-right {
        margin-left: auto;
      }

      /* --- TOOLBAR SPLIT GROUP & VOLTAGE CONTEXT MENU --- */
      .toolbar-split-group {
        display: inline-flex;
        align-items: center;
        position: relative;
      }

      .toolbar-split-group > .toolbar-toggle {
        border-top-right-radius: 0;
        border-bottom-right-radius: 0;
        border-right: none;
      }

      .toolbar-split-group .power-split-dropdown,
      .toolbar-split-group .colors-split-dropdown {
        position: relative;
        display: inline-flex;
      }

      .toolbar-split-group .power-split-dropdown .dropdown-trigger,
      .toolbar-split-group .colors-split-dropdown .dropdown-trigger {
        border-top-left-radius: 0;
        border-bottom-left-radius: 0;
        padding: 2px 5px;
        min-width: 18px;
        height: 28px;
        font-size: 10px;
        background: rgba(255, 255, 255, 0.08);
        border-left: 1px solid rgba(255, 255, 255, 0.15);
      }

      .toolbar-split-group .power-split-dropdown .dropdown-trigger:hover,
      .toolbar-split-group .colors-split-dropdown .dropdown-trigger:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .toolbar-split-group .power-split-dropdown .dropdown-menu,
      .toolbar-split-group .colors-split-dropdown .dropdown-menu {
        left: auto;
        right: 0;
        min-width: 240px;
      }

      /* --- TOOLBAR DROPDOWNS --- */
      .toolbar-dropdown {
        position: relative;
        display: inline-flex;
        align-items: center;
      }

      .dropdown-arrow {
        font-size: 9px;
        opacity: 0.7;
        margin-left: 2px;
        transition: transform 0.15s ease;
      }
      .toolbar-dropdown.open .dropdown-arrow {
        transform: rotate(180deg);
      }
      .toolbar-dropdown.open .dropdown-trigger {
        background: rgba(255, 255, 255, 0.15);
        color: #ffffff;
      }

      .dropdown-menu {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        margin-top: 4px;
        background: var(--bg-card);
        border: 1px solid var(--border-main);
        border-radius: 6px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
        min-width: 200px;
        z-index: 1000;
        padding: 4px;
        flex-direction: column;
        gap: 2px;
      }

      .toolbar-dropdown.open .dropdown-menu {
        display: flex;
      }

      .dropdown-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 6px 10px;
        font-size: 11.5px;
        background: transparent;
        border: none;
        border-radius: 4px;
        color: var(--text-main);
        cursor: pointer;
        text-align: left;
        transition: background 0.1s, color 0.1s;
      }

      .dropdown-item:hover {
        background: var(--primary-color);
        color: #ffffff;
      }

      .dropdown-item-left {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .dropdown-item-icon {
        font-size: 13px;
        width: 16px;
        text-align: center;
      }

      .dropdown-shortcut {
        font-size: 10px;
        color: var(--text-muted);
        margin-left: 14px;
        font-family: monospace;
      }

      .dropdown-item:hover .dropdown-shortcut {
        color: rgba(255, 255, 255, 0.85);
      }

      .item-danger:hover {
        background: #dc2626 !important;
        color: #ffffff !important;
      }

      .dropdown-divider {
        height: 1px;
        background: var(--border-main);
        margin: 3px 0;
      }

      /* --- DARK MODE TOOLBAR, DROPDOWN & MENU CONTRAST ENHANCEMENTS --- */
      [data-theme="dark"] #toolbar {
        border-bottom: 1px solid #1e293b;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.7);
      }

      [data-theme="dark"] .toolbar-btn {
        background: #0f172a;
        color: #e2e8f0;
        border: 1px solid #24344d;
      }

      [data-theme="dark"] .toolbar-btn:hover:not(:disabled) {
        background: #1e293b;
        color: #ffffff;
        border-color: #38bdf8;
      }

      [data-theme="dark"] .toolbar-divider {
        background: #24344d;
      }

      [data-theme="dark"] .toolbar-dropdown > .dropdown-trigger {
        background: transparent;
        border-color: transparent;
        color: #e2e8f0;
        font-weight: 600;
      }

      [data-theme="dark"] .toolbar-dropdown > .dropdown-trigger:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.15);
        color: #ffffff;
      }

      [data-theme="dark"] .toolbar-dropdown.open > .dropdown-trigger {
        background: #1e293b;
        color: #38bdf8;
        border-color: #38bdf8;
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.35);
      }

      [data-theme="dark"] .dropdown-menu {
        background: #1e293b;
        border: 1px solid #475569;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        backdrop-filter: blur(14px);
        padding: 5px;
      }

      [data-theme="dark"] .dropdown-item {
        color: #f8fafc;
        font-weight: 500;
        padding: 7px 11px;
        border-radius: 5px;
      }

      [data-theme="dark"] .dropdown-item:hover {
        background: #0284c7;
        color: #ffffff;
      }

      [data-theme="dark"] .dropdown-shortcut {
        color: #94a3b8;
      }

      [data-theme="dark"] .dropdown-item:hover .dropdown-shortcut {
        color: #e0f2fe;
      }

      [data-theme="dark"] .dropdown-divider {
        background: rgba(255, 255, 255, 0.12);
        margin: 4px 0;
      }

      /* Universal native select & option elements in dark mode */
      [data-theme="dark"] select,
      [data-theme="dark"] select option,
      [data-theme="dark"] select optgroup {
        background-color: #1e293b;
        color: #f8fafc;
        color-scheme: dark;
      }

      [data-theme="dark"] select {
        border-color: #475569;
      }

      [data-theme="dark"] select:focus {
        border-color: #38bdf8;
        box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25);
      }

      [data-theme="dark"] select option:checked {
        background-color: #0284c7;
        color: #ffffff;
      }

      /* Select components styling in dark mode */
      [data-theme="dark"] .catalog-system-select,
      [data-theme="dark"] .board-select,
      [data-theme="dark"] .sel-bar-select,
      [data-theme="dark"] .height-input-select {
        background-color: #1e293b;
        color: #f8fafc;
        border-color: #475569;
      }

      [data-theme="dark"] .catalog-system-select:hover,
      [data-theme="dark"] .board-select:hover,
      [data-theme="dark"] .sel-bar-select:hover,
      [data-theme="dark"] .height-input-select:hover {
        border-color: #64748b;
      }

      [data-theme="dark"] .catalog-system-select:focus,
      [data-theme="dark"] .board-select:focus,
      [data-theme="dark"] .sel-bar-select:focus,
      [data-theme="dark"] .height-input-select:focus {
        border-color: #38bdf8;
        box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25);
      }

      .board-btn-add {
        background: var(--primary-color);
        color: #ffffff;
        border: none;
        border-radius: 4px;
        padding: 4px 8px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        transition: background 0.15s;
      }
      .board-btn-add:hover {
        background: var(--primary-hover);
      }
      .board-item-card {
        transition: all 0.12s;
      }
      .board-item-card:hover {
        border-color: var(--primary-color) !important;
      }

      .toolbar-btn {
        background: #334155;
        color: #e2e8f0;
        border: 1px solid #475569;
        border-radius: clamp(4px, calc(var(--tb-btn-height, 28px) * 0.16), 8px);
        padding: 0 var(--tb-btn-padding-x, 8px);
        font-size: var(--tb-btn-font-size, 11.5px);
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: clamp(3px, calc(var(--tb-btn-height, 28px) * 0.14), 7px);
        height: var(--tb-btn-height, 28px);
        white-space: nowrap;
        flex-shrink: 0;
        box-sizing: border-box;
        transition: all 0.12s ease;
      }

      .toolbar-menu-group > .toolbar-dropdown > .dropdown-trigger {
        min-width: calc(var(--tb-btn-height, 28px) * 2.8);
        height: var(--tb-btn-height, 28px);
        padding: 0 var(--tb-btn-padding-x, 6px);
        font-size: var(--tb-btn-font-size, 11.5px);
        justify-content: center;
        text-align: center;
        box-sizing: border-box;
        white-space: nowrap;
      }

      .toolbar-toggle {
        min-width: calc(var(--tb-btn-height, 28px) * 2.8);
        height: var(--tb-btn-height, 28px);
        padding: 0 var(--tb-btn-padding-x, 6px);
        font-size: var(--tb-btn-font-size, 11.5px);
        justify-content: center;
        text-align: center;
        box-sizing: border-box;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex-shrink: 0;
      }

      .toolbar-btn.btn-icon-only {
        width: var(--tb-btn-height, 28px);
        min-width: var(--tb-btn-height, 28px);
        max-width: var(--tb-btn-height, 28px);
        height: var(--tb-btn-height, 28px);
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        flex-shrink: 0;
      }

      .tb-theme-btn {
        width: var(--tb-btn-height, 28px);
        min-width: var(--tb-btn-height, 28px);
        max-width: var(--tb-btn-height, 28px);
        height: var(--tb-btn-height, 28px);
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        box-sizing: border-box;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .tb-lang-btn {
        min-width: var(--tb-btn-height, 28px);
        height: var(--tb-btn-height, 28px);
        padding: 0 clamp(4px, calc(var(--tb-btn-height, 28px) * 0.18), 8px);
        font-size: var(--tb-btn-font-size, 11px);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        box-sizing: border-box;
        flex-shrink: 0;
      }

      .tb-collab-btn {
        height: var(--tb-btn-height, 28px);
        padding: 0 var(--tb-btn-padding-x, 6px);
        font-size: var(--tb-btn-font-size, 11px);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        box-sizing: border-box;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex-shrink: 0;
      }

      .toolbar-btn:hover:not(:disabled) {
        background: #475569;
        color: #ffffff;
      }

      .toolbar-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .tb-icon,
      .tb-btn-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
      }

      .toolbar-btn svg,
      .dropdown-trigger svg,
      .tb-icon svg,
      .tb-btn-icon svg {
        width: var(--tb-icon-size, 14px);
        height: var(--tb-icon-size, 14px);
      }

      .tb-text-full {
        display: inline;
      }

      .tb-text-compact {
        display: none;
      }

      .toolbar-dropdown > .dropdown-trigger {
        min-width: calc(var(--tb-btn-height, 28px) * 2.4);
        height: var(--tb-btn-height, 28px);
        font-size: var(--tb-btn-font-size, 11.5px);
        justify-content: center;
        text-align: center;
        box-sizing: border-box;
      }

      .toolbar-toggle.active {
        background: #15803d;
        border-color: #22c55e;
        color: #ffffff;
        box-shadow: 0 0 6px rgba(34, 197, 94, 0.35);
      }

      #tb-colors.active.mode-layers {
        background: #0284c7;
        border-color: #38bdf8;
        color: #ffffff;
        box-shadow: 0 0 6px rgba(56, 189, 248, 0.45);
      }

      #tb-sidebar-toggle.active {
        background: #0284c7;
        border-color: #38bdf8;
        color: #ffffff;
        box-shadow: 0 0 6px rgba(56, 189, 248, 0.35);
      }

      .toolbar-toggle.active-warning, .toolbar-btn.active-warning {
        background: #b45309;
        border-color: #f59e0b;
        color: #ffffff;
        box-shadow: 0 0 6px rgba(245, 158, 11, 0.35);
      }

      .btn-danger:hover:not(:disabled) {
        background: #b91c1c;
        border-color: #ef4444;
      }

      .tb-short-circuit-btn {
        background: #dc2626 !important;
        border: 1px solid #f87171 !important;
        color: #ffffff !important;
        font-weight: 700 !important;
        font-size: 11px !important;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        width: 112px;
        min-width: 112px;
        max-width: 112px;
        height: 28px;
        gap: 5px;
        padding: 3px 6px;
        border-radius: 6px;
        cursor: pointer;
        animation: pulse-short-circuit 1.5s infinite;
        box-shadow: 0 0 8px rgba(220, 38, 38, 0.6);
        box-sizing: border-box;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex-shrink: 0;
      }
      .tb-short-circuit-btn:hover {
        background: #b91c1c !important;
        border-color: #fca5a5 !important;
      }
      @keyframes pulse-short-circuit {
        0% { box-shadow: 0 0 4px rgba(220, 38, 38, 0.5); transform: scale(1); }
        50% { box-shadow: 0 0 12px rgba(239, 68, 68, 0.85); transform: scale(1.03); }
        100% { box-shadow: 0 0 4px rgba(220, 38, 38, 0.5); transform: scale(1); }
      }

      /* --- SIDEBAR --- */
      #sidebar {
        background: var(--bg-sidebar);
        border-right: 1px solid var(--border-main);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        z-index: 10;
        position: relative;
      }

      #right-sidebar {
        position: absolute;
        top: calc(var(--toolbar-height, 42px) + 8px);
        right: 14px;
        width: var(--right-sidebar-width, 290px);
        max-height: calc(100vh - var(--toolbar-height, 42px) - 24px);
        background: var(--bg-card);
        border: 1px solid var(--border-main);
        border-radius: 10px;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.4), 0 2px 10px rgba(0, 0, 0, 0.2);
        display: flex;
        flex-direction: column;
        overflow: visible;
        z-index: 200;
        backdrop-filter: blur(12px);
      }

      /* --- RESIZER SPLITTERS --- */
      #sidebar-resizer.ui-resizer-v {
        position: absolute;
        top: var(--toolbar-height, 42px);
        left: calc(var(--sidebar-width, 280px) - 4px);
        width: 8px;
        height: calc(100vh - var(--toolbar-height, 42px));
        cursor: col-resize;
        z-index: 105;
        touch-action: none;
        user-select: none;
      }
      #sidebar-resizer.ui-resizer-v::after {
        content: "";
        position: absolute;
        top: 0;
        left: 3px;
        width: 2px;
        height: 100%;
        background: transparent;
        transition: background 0.15s ease;
      }
      #sidebar-resizer.ui-resizer-v:hover::after,
      #sidebar-resizer.ui-resizer-v.dragging::after {
        background: var(--primary-color, #0284c7);
      }

      #toolbar-resizer.ui-resizer-h {
        position: absolute;
        top: calc(var(--toolbar-height, 42px) - 4px);
        left: 0;
        width: 100vw;
        height: 8px;
        cursor: row-resize;
        z-index: 155;
        touch-action: none;
        user-select: none;
      }
      #toolbar-resizer.ui-resizer-h::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 0;
        width: 100%;
        height: 2px;
        background: transparent;
        transition: background 0.15s ease;
      }
      #toolbar-resizer.ui-resizer-h:hover::after,
      #toolbar-resizer.ui-resizer-h.dragging::after {
        background: var(--primary-color, #0284c7);
      }

      .ui-resizer-right-left {
        position: absolute;
        top: 0;
        left: -4px;
        width: 8px;
        height: 100%;
        cursor: ew-resize;
        z-index: 250;
        touch-action: none;
        user-select: none;
      }
      .ui-resizer-right-left::after {
        content: "";
        position: absolute;
        top: 0;
        left: 3px;
        width: 2px;
        height: 100%;
        background: transparent;
        transition: background 0.15s ease;
      }
      .ui-resizer-right-left:hover::after,
      .ui-resizer-right-left.dragging::after {
        background: var(--primary-color, #0284c7);
      }

      .ui-resizer-right-bottom {
        position: absolute;
        bottom: -4px;
        left: 0;
        width: 100%;
        height: 8px;
        cursor: ns-resize;
        z-index: 250;
        touch-action: none;
        user-select: none;
      }
      .ui-resizer-right-bottom::after {
        content: "";
        position: absolute;
        bottom: 3px;
        left: 0;
        width: 100%;
        height: 2px;
        background: transparent;
        transition: background 0.15s ease;
      }
      .ui-resizer-right-bottom:hover::after,
      .ui-resizer-right-bottom.dragging::after {
        background: var(--primary-color, #0284c7);
      }

      .ui-resizer-right-corner {
        position: absolute;
        bottom: -4px;
        left: -4px;
        width: 14px;
        height: 14px;
        cursor: nesw-resize;
        z-index: 260;
        touch-action: none;
        user-select: none;
        border-bottom-left-radius: 8px;
        transition: background 0.15s ease;
      }
      .ui-resizer-right-corner:hover,
      .ui-resizer-right-corner.dragging {
        background: var(--primary-color, #0284c7);
      }

      #app.bars-locked #toolbar-resizer,
      #app.bars-locked #right-sidebar-resizer-left,
      #app.bars-locked #right-sidebar-resizer-bottom,

      .models-import-area {

      .layer-action-btn {

      }
      .layer-action-btn.btn-danger:hover {

        color: #ffffff;
        border-color: #ef4444;
      }

      .layer-move-pill {
